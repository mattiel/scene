<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@scene/surfaces Test - Surface System</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #1a1a1a;
      color: #fff;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 20px;
    }

    .status {
      padding: 10px;
      margin: 10px 0;
      border-radius: 4px;
      font-family: monospace;
    }

    .status.success {
      background: #0a4d0a;
      border: 1px solid #0f6f0f;
    }

    .status.error {
      background: #4d0a0a;
      border: 1px solid #6f0f0f;
    }

    .status.info {
      background: #0a2d4d;
      border: 1px solid #0f3f6f;
    }

    .test-area {
      margin: 20px 0;
      padding: 20px;
      background: #2a2a2a;
      border-radius: 8px;
      border: 1px solid #444;
    }

    .test-area h2 {
      margin-bottom: 15px;
      font-size: 1.2em;
      color: #4af;
    }

    .tracked-elements {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin: 20px 0;
    }

    .tracked-element {
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
      transition: transform 0.3s;
    }

    .tracked-element:hover {
      transform: scale(1.05);
    }

    .test-results {
      margin-top: 20px;
    }

    .test-item {
      padding: 8px;
      margin: 5px 0;
      background: #2a2a2a;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .test-item::before {
      content: '✓';
      color: #0f6f0f;
      font-weight: bold;
    }

    .test-item.failed::before {
      content: '✗';
      color: #6f0f0f;
    }

    .surface-info {
      background: #1a1a1a;
      padding: 15px;
      border-radius: 4px;
      margin: 10px 0;
      font-family: monospace;
      font-size: 0.9em;
    }

    .surface-info .label {
      color: #888;
      display: inline-block;
      width: 150px;
    }

    button {
      padding: 10px 20px;
      margin: 5px;
      background: #4af;
      border: none;
      border-radius: 4px;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #6cf;
    }

    button:disabled {
      background: #444;
      color: #888;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>@scene/surfaces Test - Surface System</h1>
    
    <div id="status"></div>
    
    <div class="test-area">
      <h2>Tracked DOM Elements</h2>
      <p>These elements are tracked by the Surface system. Resize the window or scroll to see updates.</p>
      <div class="tracked-elements" id="tracked-elements">
        <div class="tracked-element" data-surface-id="element-1">Element 1</div>
        <div class="tracked-element" data-surface-id="element-2">Element 2</div>
        <div class="tracked-element" data-surface-id="element-3">Element 3</div>
        <div class="tracked-element" data-surface-id="element-4">Element 4</div>
      </div>
    </div>

    <div class="test-area">
      <h2>Surface Information</h2>
      <div id="surface-info"></div>
    </div>

    <div class="test-area">
      <h2>Interactive Tests</h2>
      <button id="btn-add-surface">Add New Surface</button>
      <button id="btn-create-ghost">Create Ghost Surface</button>
      <button id="btn-remove-surface">Remove Last Surface</button>
      <button id="btn-force-update">Force Layout Update</button>
    </div>
    
    <div class="test-results" id="results"></div>
  </div>

  <script type="module">
    // Import from the built package
    // Note: In a real setup, you'd build the package first with pnpm build
    import { 
      Surface,
      SurfaceRegistry,
      LayoutTracker,
      createGhostFromElement,
      createGhost
    } from '../../dist/index.js';

    const statusEl = document.getElementById('status');
    const resultsEl = document.getElementById('results');
    const surfaceInfoEl = document.getElementById('surface-info');
    const trackedElementsContainer = document.getElementById('tracked-elements');

    let registry = null;
    let tracker = null;
    let surfaceCounter = 5;

    function addStatus(message, type = 'success') {
      const div = document.createElement('div');
      div.className = `status ${type}`;
      div.textContent = message;
      statusEl.appendChild(div);
    }

    function addTestResult(message, passed = true) {
      const div = document.createElement('div');
      div.className = `test-item ${passed ? '' : 'failed'}`;
      div.textContent = message;
      resultsEl.appendChild(div);
    }

    function updateSurfaceInfo() {
      if (!registry) return;

      let html = '<div class="surface-info">';
      html += `<div><span class="label">Total Surfaces:</span>${registry.size}</div>`;
      html += `<div><span class="label">Visible Surfaces:</span>${registry.visible().length}</div>`;
      html += `<div><span class="label">Ghost Surfaces:</span>${registry.ghosts().length}</div>`;
      html += `<div><span class="label">Tracked Elements:</span>${tracker ? tracker.trackedCount : 0}</div>`;
      html += '</div>';

      // List all surfaces with their rects
      registry.sorted().forEach(surface => {
        const rect = surface.rect;
        html += '<div class="surface-info">';
        html += `<div style="color: #4af; margin-bottom: 8px;">Surface: ${surface.id}</div>`;
        html += `<div><span class="label">Position:</span>x=${rect.x.toFixed(0)}, y=${rect.y.toFixed(0)}</div>`;
        html += `<div><span class="label">Size:</span>${rect.width.toFixed(0)} × ${rect.height.toFixed(0)}</div>`;
        html += `<div><span class="label">Z-Index:</span>${surface.zIndex}</div>`;
        html += `<div><span class="label">Visible:</span>${surface.isVisible}</div>`;
        html += `<div><span class="label">Ghost:</span>${surface.isGhost}</div>`;
        html += '</div>';
      });

      surfaceInfoEl.innerHTML = html;
    }

    async function runTests() {
      addStatus('Starting @scene/surfaces tests...', 'success');

      // Test 1: Create SurfaceRegistry
      registry = new SurfaceRegistry();
      addTestResult('SurfaceRegistry created', true);
      addTestResult(`Initial surface count: ${registry.size}`, registry.size === 0);

      // Test 2: Create Surface instances for tracked elements
      const elements = document.querySelectorAll('.tracked-element');
      elements.forEach(element => {
        const id = element.getAttribute('data-surface-id');
        const surface = new Surface(id, element);
        registry.add(surface);
      });
      addTestResult(`Created ${elements.length} surfaces from DOM elements`, true);
      addTestResult(`Registry size: ${registry.size}`, registry.size === elements.length);

      // Test 3: Test surface rect tracking
      const firstSurface = registry.get('element-1');
      if (firstSurface) {
        const rect = firstSurface.rect;
        addTestResult(`Surface rect captured: ${rect.width.toFixed(0)}×${rect.height.toFixed(0)}`, true);
        addTestResult(`Surface element reference maintained`, firstSurface.element !== null);
      }

      // Test 4: Test motion properties
      firstSurface.set('opacity', 0.8);
      firstSurface.set('scale', 1.2);
      addTestResult(`Motion properties set (opacity: ${firstSurface.get('opacity')}, scale: ${firstSurface.get('scale')})`, true);

      // Test 5: Create LayoutTracker
      tracker = new LayoutTracker(registry);
      tracker.start();
      addTestResult('LayoutTracker created and started', true);
      addTestResult(`Tracking ${tracker.trackedCount} elements`, tracker.trackedCount === registry.size);

      // Test 6: Test layout update callback
      let layoutUpdateReceived = false;
      firstSurface.onLayoutChange((rect) => {
        layoutUpdateReceived = true;
        addStatus(`Layout update: element-1 at (${rect.x.toFixed(0)}, ${rect.y.toFixed(0)})`, 'info');
        updateSurfaceInfo();
      });
      addTestResult('Layout change callback registered', true);

      // Test 7: Create a ghost surface
      const ghostSurface = createGhostFromElement('ghost-1', elements[0]);
      registry.add(ghostSurface);
      addTestResult(`Ghost surface created: ${ghostSurface.id}`, true);
      addTestResult(`Ghost surface isGhost: ${ghostSurface.isGhost}`, ghostSurface.isGhost === true);
      addTestResult(`Ghost surface has rect: ${ghostSurface.rect.width > 0}`, ghostSurface.rect.width > 0);

      // Test 8: Test surface sorting by z-index
      const surfaces = registry.sorted();
      addTestResult(`Surfaces sorted by z-index: ${surfaces.length} surfaces`, true);

      // Test 9: Test surface hit testing
      const centerX = firstSurface.rect.x + firstSurface.rect.width / 2;
      const centerY = firstSurface.rect.y + firstSurface.rect.height / 2;
      const hitSurfaces = registry.at(centerX, centerY);
      addTestResult(`Hit testing at center of element-1: found ${hitSurfaces.length} surface(s)`, hitSurfaces.length > 0);

      // Test 10: Test registry filters
      const regularSurfaces = registry.regular();
      const ghostSurfaces = registry.ghosts();
      addTestResult(`Regular surfaces: ${regularSurfaces.length}`, regularSurfaces.length === elements.length);
      addTestResult(`Ghost surfaces: ${ghostSurfaces.length}`, ghostSurfaces.length === 1);

      updateSurfaceInfo();
      addStatus('All tests completed successfully!', 'success');

      // Set up interactive buttons
      setupInteractiveTests();
    }

    function setupInteractiveTests() {
      // Add surface button
      document.getElementById('btn-add-surface').addEventListener('click', () => {
        const newElement = document.createElement('div');
        newElement.className = 'tracked-element';
        newElement.setAttribute('data-surface-id', `element-${surfaceCounter}`);
        newElement.textContent = `Element ${surfaceCounter}`;
        trackedElementsContainer.appendChild(newElement);

        const surface = new Surface(`element-${surfaceCounter}`, newElement);
        registry.add(surface);
        
        addStatus(`Added surface: element-${surfaceCounter}`, 'info');
        surfaceCounter++;
        updateSurfaceInfo();
      });

      // Create ghost button
      document.getElementById('btn-create-ghost').addEventListener('click', () => {
        const elements = document.querySelectorAll('.tracked-element');
        if (elements.length > 0) {
          const randomElement = elements[Math.floor(Math.random() * elements.length)];
          const ghostId = `ghost-${Date.now()}`;
          const ghost = createGhostFromElement(ghostId, randomElement);
          registry.add(ghost);
          
          addStatus(`Created ghost surface: ${ghostId}`, 'info');
          updateSurfaceInfo();
        }
      });

      // Remove surface button
      document.getElementById('btn-remove-surface').addEventListener('click', () => {
        const surfaces = registry.regular();
        if (surfaces.length > 0) {
          const lastSurface = surfaces[surfaces.length - 1];
          if (lastSurface.element && lastSurface.element.parentNode) {
            lastSurface.element.parentNode.removeChild(lastSurface.element);
          }
          registry.remove(lastSurface.id);
          lastSurface.destroy();
          
          addStatus(`Removed surface: ${lastSurface.id}`, 'info');
          updateSurfaceInfo();
        }
      });

      // Force update button
      document.getElementById('btn-force-update').addEventListener('click', () => {
        if (tracker) {
          tracker.forceUpdate();
          addStatus('Forced layout update for all surfaces', 'info');
          updateSurfaceInfo();
        }
      });

      // Listen for window resize
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          addStatus('Window resized - surfaces updated automatically', 'info');
          updateSurfaceInfo();
        }, 100);
      });
    }

    // Run tests
    runTests().catch(err => {
      addStatus(`Test error: ${err.message}`, 'error');
      console.error(err);
    });
  </script>
</body>
</html>
