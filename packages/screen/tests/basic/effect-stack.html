<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Effect Stack Test - @scene/screen</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #1a1a1a;
      color: #fff;
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 10px;
    }

    .description {
      color: #888;
      margin-bottom: 20px;
    }

    .status {
      padding: 10px;
      margin: 10px 0;
      border-radius: 4px;
      font-family: monospace;
      font-size: 14px;
    }

    .status.success {
      background: #0a4d0a;
      border: 1px solid #0f6f0f;
    }

    .status.error {
      background: #4d0a0a;
      border: 1px solid #6f0f0f;
    }

    .status.info {
      background: #0a2d4d;
      border: 1px solid #0f4f6f;
    }

    canvas {
      width: 100%;
      max-width: 800px;
      height: 400px;
      background: #000;
      border: 1px solid #333;
      margin: 20px 0;
      display: block;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 20px 0;
    }

    .control-group {
      background: #2a2a2a;
      padding: 15px;
      border-radius: 8px;
      min-width: 200px;
    }

    .control-group h3 {
      font-size: 14px;
      margin-bottom: 10px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .control-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    label {
      font-size: 13px;
      min-width: 80px;
    }

    input[type="range"] {
      flex: 1;
      cursor: pointer;
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .value {
      font-family: monospace;
      font-size: 12px;
      color: #888;
      min-width: 40px;
      text-align: right;
    }

    button {
      padding: 8px 16px;
      background: #444;
      border: 1px solid #555;
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background: #555;
    }

    button.active {
      background: #0a4d0a;
      border-color: #0f6f0f;
    }

    .test-results {
      margin-top: 20px;
    }

    .test-item {
      padding: 8px;
      margin: 5px 0;
      background: #2a2a2a;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }

    .test-item::before {
      content: '✓';
      color: #0f6f0f;
      font-weight: bold;
    }

    .test-item.failed::before {
      content: '✗';
      color: #6f0f0f;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>@scene/screen Effect Stack Test</h1>
    <p class="description">Interactive test for EffectStack with blur, vignette, and chromatic aberration effects.</p>
    
    <div id="status"></div>
    
    <canvas id="canvas"></canvas>
    
    <div class="controls">
      <div class="control-group">
        <h3>Blur Effect</h3>
        <div class="control-row">
          <input type="checkbox" id="blur-enabled" checked>
          <label for="blur-enabled">Enabled</label>
        </div>
        <div class="control-row">
          <label>Strength</label>
          <input type="range" id="blur-strength" min="0" max="10" step="0.1" value="2">
          <span class="value" id="blur-strength-value">2.0</span>
        </div>
        <div class="control-row">
          <button id="blur-horizontal">Horizontal</button>
          <button id="blur-vertical">Vertical</button>
        </div>
      </div>

      <div class="control-group">
        <h3>Vignette Effect</h3>
        <div class="control-row">
          <input type="checkbox" id="vignette-enabled" checked>
          <label for="vignette-enabled">Enabled</label>
        </div>
        <div class="control-row">
          <label>Strength</label>
          <input type="range" id="vignette-strength" min="0" max="1" step="0.05" value="0.5">
          <span class="value" id="vignette-strength-value">0.5</span>
        </div>
        <div class="control-row">
          <label>Radius</label>
          <input type="range" id="vignette-radius" min="0" max="1" step="0.05" value="0.5">
          <span class="value" id="vignette-radius-value">0.5</span>
        </div>
        <div class="control-row">
          <label>Softness</label>
          <input type="range" id="vignette-softness" min="0" max="1" step="0.05" value="0.5">
          <span class="value" id="vignette-softness-value">0.5</span>
        </div>
      </div>

      <div class="control-group">
        <h3>Chromatic Aberration</h3>
        <div class="control-row">
          <input type="checkbox" id="chroma-enabled" checked>
          <label for="chroma-enabled">Enabled</label>
        </div>
        <div class="control-row">
          <label>Strength</label>
          <input type="range" id="chroma-strength" min="0" max="0.05" step="0.001" value="0.01">
          <span class="value" id="chroma-strength-value">0.010</span>
        </div>
        <div class="control-row">
          <button id="chroma-subtle">Subtle</button>
          <button id="chroma-moderate">Moderate</button>
          <button id="chroma-strong">Strong</button>
        </div>
      </div>
    </div>
    
    <div class="test-results" id="results"></div>
  </div>

  <script type="module">
    import { 
      WebGPUContext, 
      ShaderLibrary, 
      ScreenPass 
    } from '../../node_modules/@scene/renderer/dist/index.js';

    import {
      EffectStack,
      createBlurEffect,
      createVignetteEffect,
      createChromaticAberrationEffect,
    } from '../dist/index.js';

    const statusEl = document.getElementById('status');
    const resultsEl = document.getElementById('results');
    const canvas = document.getElementById('canvas');

    function addStatus(message, type = 'success') {
      const div = document.createElement('div');
      div.className = `status ${type}`;
      div.textContent = message;
      statusEl.appendChild(div);
    }

    function addTestResult(message, passed = true) {
      const div = document.createElement('div');
      div.className = `test-item ${passed ? '' : 'failed'}`;
      div.textContent = message;
      resultsEl.appendChild(div);
    }

    // State
    let context, shaderLibrary, screenPass, effectStack;
    let blurEffect, vignetteEffect, chromaEffect;
    let sourceTexture, animationTime = 0;
    let running = true;

    async function initialize() {
      addStatus('Initializing WebGPU...', 'info');

      // Initialize WebGPU
      context = new WebGPUContext();
      const initialized = await context.initialize({
        canvas,
        powerPreference: 'high-performance'
      });

      if (!initialized) {
        addStatus('WebGPU not available - test cannot run', 'error');
        return false;
      }

      addStatus('WebGPU initialized', 'success');
      addTestResult('WebGPU context created');

      // Initialize ShaderLibrary
      shaderLibrary = new ShaderLibrary();
      shaderLibrary.setDevice(context.device);
      shaderLibrary.registerDefaults();
      addTestResult('ShaderLibrary initialized with defaults');

      // Initialize ScreenPass
      screenPass = new ScreenPass(context, shaderLibrary);
      screenPass.initialize();
      addTestResult('ScreenPass initialized');

      // Initialize EffectStack
      effectStack = new EffectStack(screenPass);
      effectStack.initialize();
      addTestResult('EffectStack initialized');

      // Register effect factories
      effectStack.registerFactory('blur', createBlurEffect);
      effectStack.registerFactory('vignette', createVignetteEffect);
      effectStack.registerFactory('chromatic_aberration', createChromaticAberrationEffect);
      addTestResult('Effect factories registered');

      // Add effects
      blurEffect = effectStack.add({ 
        type: 'blur', 
        params: { directionX: 1, directionY: 0, strength: 2 } 
      });
      vignetteEffect = effectStack.add({ type: 'vignette' });
      chromaEffect = effectStack.add({ type: 'chromatic_aberration' });
      addTestResult(`Created ${effectStack.count} effects`);

      // Create source texture with animated pattern
      sourceTexture = context.device.createTexture({
        size: [canvas.width, canvas.height],
        format: context.format,
        usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_DST
      });

      addStatus('Ready! Adjust controls to test effects.', 'success');

      return true;
    }

    function setupControls() {
      // Blur controls
      const blurEnabled = document.getElementById('blur-enabled');
      const blurStrength = document.getElementById('blur-strength');
      const blurStrengthValue = document.getElementById('blur-strength-value');

      blurEnabled.addEventListener('change', () => {
        if (blurEnabled.checked) {
          effectStack.enable(blurEffect.id);
        } else {
          effectStack.disable(blurEffect.id);
        }
      });

      blurStrength.addEventListener('input', () => {
        blurStrengthValue.textContent = parseFloat(blurStrength.value).toFixed(1);
        effectStack.updateEffect(blurEffect.id, { strength: parseFloat(blurStrength.value) });
      });

      document.getElementById('blur-horizontal').addEventListener('click', () => {
        effectStack.updateEffect(blurEffect.id, { directionX: 1, directionY: 0 });
      });

      document.getElementById('blur-vertical').addEventListener('click', () => {
        effectStack.updateEffect(blurEffect.id, { directionX: 0, directionY: 1 });
      });

      // Vignette controls
      const vignetteEnabled = document.getElementById('vignette-enabled');
      const vignetteStrength = document.getElementById('vignette-strength');
      const vignetteRadius = document.getElementById('vignette-radius');
      const vignetteSoftness = document.getElementById('vignette-softness');

      vignetteEnabled.addEventListener('change', () => {
        if (vignetteEnabled.checked) {
          effectStack.enable(vignetteEffect.id);
        } else {
          effectStack.disable(vignetteEffect.id);
        }
      });

      vignetteStrength.addEventListener('input', () => {
        document.getElementById('vignette-strength-value').textContent = parseFloat(vignetteStrength.value).toFixed(2);
        effectStack.updateEffect(vignetteEffect.id, { strength: parseFloat(vignetteStrength.value) });
      });

      vignetteRadius.addEventListener('input', () => {
        document.getElementById('vignette-radius-value').textContent = parseFloat(vignetteRadius.value).toFixed(2);
        effectStack.updateEffect(vignetteEffect.id, { radius: parseFloat(vignetteRadius.value) });
      });

      vignetteSoftness.addEventListener('input', () => {
        document.getElementById('vignette-softness-value').textContent = parseFloat(vignetteSoftness.value).toFixed(2);
        effectStack.updateEffect(vignetteEffect.id, { softness: parseFloat(vignetteSoftness.value) });
      });

      // Chromatic aberration controls
      const chromaEnabled = document.getElementById('chroma-enabled');
      const chromaStrength = document.getElementById('chroma-strength');

      chromaEnabled.addEventListener('change', () => {
        if (chromaEnabled.checked) {
          effectStack.enable(chromaEffect.id);
        } else {
          effectStack.disable(chromaEffect.id);
        }
      });

      chromaStrength.addEventListener('input', () => {
        document.getElementById('chroma-strength-value').textContent = parseFloat(chromaStrength.value).toFixed(3);
        effectStack.updateEffect(chromaEffect.id, { strength: parseFloat(chromaStrength.value) });
      });

      document.getElementById('chroma-subtle').addEventListener('click', () => {
        chromaStrength.value = 0.005;
        document.getElementById('chroma-strength-value').textContent = '0.005';
        effectStack.updateEffect(chromaEffect.id, { strength: 0.005 });
      });

      document.getElementById('chroma-moderate').addEventListener('click', () => {
        chromaStrength.value = 0.015;
        document.getElementById('chroma-strength-value').textContent = '0.015';
        effectStack.updateEffect(chromaEffect.id, { strength: 0.015 });
      });

      document.getElementById('chroma-strong').addEventListener('click', () => {
        chromaStrength.value = 0.03;
        document.getElementById('chroma-strength-value').textContent = '0.030';
        effectStack.updateEffect(chromaEffect.id, { strength: 0.03 });
      });
    }

    function render() {
      if (!running) return;

      animationTime += 0.016;

      const commandEncoder = context.device.createCommandEncoder();

      // Render animated pattern to source texture
      const sourcePass = commandEncoder.beginRenderPass({
        colorAttachments: [{
          view: sourceTexture.createView(),
          clearValue: { 
            r: 0.2 + Math.sin(animationTime) * 0.1, 
            g: 0.3 + Math.cos(animationTime * 0.7) * 0.1, 
            b: 0.5 + Math.sin(animationTime * 1.3) * 0.1, 
            a: 1.0 
          },
          loadOp: 'clear',
          storeOp: 'store'
        }]
      });
      sourcePass.end();

      // Execute effect stack
      effectStack.execute(commandEncoder, sourceTexture);

      context.device.queue.submit([commandEncoder.finish()]);

      requestAnimationFrame(render);
    }

    // Initialize and run
    initialize().then(success => {
      if (success) {
        setupControls();
        requestAnimationFrame(render);
      }
    }).catch(err => {
      addStatus(`Error: ${err.message}`, 'error');
      console.error(err);
    });

    // Cleanup on page unload
    window.addEventListener('beforeunload', () => {
      running = false;
      effectStack?.destroy();
      screenPass?.destroy();
      context?.destroy();
    });
  </script>
</body>
</html>
