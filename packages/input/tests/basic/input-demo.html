<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@scene/input Demo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      padding: 20px;
    }
    
    h1 {
      margin-bottom: 20px;
      color: #fff;
    }
    
    .container {
      display: flex;
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    
    .demo-area {
      flex: 1;
    }
    
    .canvas-wrapper {
      position: relative;
      width: 600px;
      height: 400px;
      background: #0f0f23;
      border-radius: 8px;
      overflow: hidden;
      touch-action: none;
    }
    
    .surface {
      position: absolute;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.1s ease-out, box-shadow 0.1s ease-out;
    }
    
    .surface:hover {
      transform: scale(1.02);
    }
    
    .surface.hovered {
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.5);
    }
    
    .surface.dragging {
      cursor: grabbing;
      z-index: 100;
    }
    
    .surface-label {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-weight: bold;
      color: white;
      text-shadow: 0 1px 3px rgba(0,0,0,0.3);
      pointer-events: none;
    }
    
    .draggable-box {
      position: absolute;
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      border-radius: 12px;
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
      text-shadow: 0 1px 3px rgba(0,0,0,0.3);
      user-select: none;
    }
    
    .draggable-box.dragging {
      cursor: grabbing;
      transform: scale(1.1);
      box-shadow: 0 10px 30px rgba(245, 87, 108, 0.4);
    }
    
    .info-panel {
      width: 300px;
    }
    
    .panel {
      background: #16213e;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }
    
    .panel h3 {
      margin-bottom: 12px;
      color: #667eea;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .stat {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #1a1a2e;
    }
    
    .stat:last-child {
      border-bottom: none;
    }
    
    .stat-label {
      color: #888;
    }
    
    .stat-value {
      font-family: 'Monaco', monospace;
      color: #4ade80;
    }
    
    .log {
      height: 200px;
      overflow-y: auto;
      font-family: 'Monaco', monospace;
      font-size: 12px;
      line-height: 1.6;
    }
    
    .log-entry {
      padding: 2px 4px;
      border-radius: 2px;
    }
    
    .log-entry.tap { color: #4ade80; }
    .log-entry.drag { color: #60a5fa; }
    .log-entry.hover { color: #f59e0b; }
    .log-entry.inertia { color: #a78bfa; }
    
    .controls {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }
    
    button {
      padding: 8px 16px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }
    
    button:hover {
      background: #5a67d8;
    }
    
    button.active {
      background: #4ade80;
    }
  </style>
</head>
<body>
  <h1>@scene/input Demo</h1>
  
  <div class="container">
    <div class="demo-area">
      <div class="canvas-wrapper" id="canvas-wrapper">
        <!-- Surfaces will be created here -->
        <div class="surface" id="surface-1" style="left: 50px; top: 50px; width: 150px; height: 100px;">
          <span class="surface-label">Surface 1</span>
        </div>
        <div class="surface" id="surface-2" style="left: 250px; top: 100px; width: 120px; height: 120px;">
          <span class="surface-label">Surface 2</span>
        </div>
        <div class="surface" id="surface-3" style="left: 400px; top: 50px; width: 150px; height: 80px;">
          <span class="surface-label">Surface 3</span>
        </div>
        
        <!-- Draggable box -->
        <div class="draggable-box" id="draggable" style="left: 260px; top: 260px;">
          Drag Me
        </div>
      </div>
      
      <div class="controls">
        <button id="btn-reset">Reset Position</button>
        <button id="btn-clear-log">Clear Log</button>
      </div>
    </div>
    
    <div class="info-panel">
      <div class="panel">
        <h3>Pointer State</h3>
        <div class="stat">
          <span class="stat-label">Position</span>
          <span class="stat-value" id="pointer-pos">-</span>
        </div>
        <div class="stat">
          <span class="stat-label">Delta</span>
          <span class="stat-value" id="pointer-delta">-</span>
        </div>
        <div class="stat">
          <span class="stat-label">Dragging</span>
          <span class="stat-value" id="is-dragging">No</span>
        </div>
        <div class="stat">
          <span class="stat-label">Hovered</span>
          <span class="stat-value" id="hovered-surface">None</span>
        </div>
      </div>
      
      <div class="panel">
        <h3>Inertia State</h3>
        <div class="stat">
          <span class="stat-label">Active</span>
          <span class="stat-value" id="inertia-active">No</span>
        </div>
        <div class="stat">
          <span class="stat-label">Velocity</span>
          <span class="stat-value" id="inertia-velocity">-</span>
        </div>
      </div>
      
      <div class="panel">
        <h3>Event Log</h3>
        <div class="log" id="log"></div>
      </div>
    </div>
  </div>

  <script type="module">
    // Import from built package (run `pnpm build` first)
    // For development, we'll implement inline
    
    // ============================================
    // Inline implementation for demo purposes
    // (In production, import from @scene/input)
    // ============================================
    
    // Simple Picking implementation
    class SimplePicking {
      constructor() {
        this.surfaces = [];
        this.hoveredIds = new Set();
        this.callbacks = {};
      }
      
      setSurfaces(surfaces) {
        this.surfaces = surfaces;
      }
      
      setCallbacks(callbacks) {
        this.callbacks = callbacks;
      }
      
      pick(x, y) {
        const hits = [];
        for (const surface of this.surfaces) {
          const rect = surface.element.getBoundingClientRect();
          const wrapper = document.getElementById('canvas-wrapper').getBoundingClientRect();
          const localRect = {
            x: rect.left - wrapper.left,
            y: rect.top - wrapper.top,
            width: rect.width,
            height: rect.height,
          };
          
          if (x >= localRect.x && x <= localRect.x + localRect.width &&
              y >= localRect.y && y <= localRect.y + localRect.height) {
            hits.push({
              surface,
              localX: x - localRect.x,
              localY: y - localRect.y,
            });
          }
        }
        return hits.sort((a, b) => b.surface.zIndex - a.surface.zIndex);
      }
      
      handleMove(x, y) {
        const hits = this.pick(x, y);
        const currentIds = new Set(hits.map(h => h.surface.id));
        
        // Left
        for (const id of this.hoveredIds) {
          if (!currentIds.has(id)) {
            const surface = this.surfaces.find(s => s.id === id);
            if (surface) {
              this.callbacks.onLeave?.(surface);
            }
          }
        }
        
        // Entered
        for (const hit of hits) {
          if (!this.hoveredIds.has(hit.surface.id)) {
            this.callbacks.onEnter?.(hit.surface);
          }
        }
        
        this.hoveredIds = currentIds;
        return hits;
      }
    }
    
    // Simple Inertia implementation
    class SimpleInertia {
      constructor(options = {}) {
        this.friction = options.friction ?? 0.92;
        this.minVelocity = options.minVelocity ?? 0.1;
        this.bounce = options.bounce ?? 0.5;
        this.bounds = options.bounds ?? {};
        
        this.samples = [];
        this.x = 0;
        this.y = 0;
        this.vx = 0;
        this.vy = 0;
        this.isActive = false;
        this.animId = null;
        this.callback = null;
      }
      
      setCallback(cb) {
        this.callback = cb;
      }
      
      setBounds(bounds) {
        this.bounds = { ...this.bounds, ...bounds };
      }
      
      startTracking(x, y) {
        this.stop();
        this.samples = [{ x, y, t: performance.now() }];
        this.x = x;
        this.y = y;
      }
      
      addSample(x, y) {
        this.x = x;
        this.y = y;
        this.samples.push({ x, y, t: performance.now() });
        if (this.samples.length > 5) this.samples.shift();
      }
      
      release() {
        if (this.samples.length < 2) return;
        
        const recent = this.samples.slice(-3);
        const first = recent[0];
        const last = recent[recent.length - 1];
        const dt = last.t - first.t;
        
        if (dt > 0) {
          this.vx = (last.x - first.x) / dt;
          this.vy = (last.y - first.y) / dt;
        }
        
        const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
        if (speed < this.minVelocity) {
          this.stop();
          return;
        }
        
        this.isActive = true;
        this.lastTime = performance.now();
        this.animate();
      }
      
      stop() {
        if (this.animId) cancelAnimationFrame(this.animId);
        this.animId = null;
        this.isActive = false;
        this.vx = 0;
        this.vy = 0;
      }
      
      animate = () => {
        const now = performance.now();
        const dt = now - this.lastTime;
        this.lastTime = now;
        
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.vx *= this.friction;
        this.vy *= this.friction;
        
        // Bounds
        if (this.bounds.minX !== undefined && this.x < this.bounds.minX) {
          this.x = this.bounds.minX;
          this.vx = -this.vx * this.bounce;
        }
        if (this.bounds.maxX !== undefined && this.x > this.bounds.maxX) {
          this.x = this.bounds.maxX;
          this.vx = -this.vx * this.bounce;
        }
        if (this.bounds.minY !== undefined && this.y < this.bounds.minY) {
          this.y = this.bounds.minY;
          this.vy = -this.vy * this.bounce;
        }
        if (this.bounds.maxY !== undefined && this.y > this.bounds.maxY) {
          this.y = this.bounds.maxY;
          this.vy = -this.vy * this.bounce;
        }
        
        this.callback?.({
          isActive: this.isActive,
          x: this.x,
          y: this.y,
          velocityX: this.vx,
          velocityY: this.vy,
        });
        
        const speed = Math.sqrt(this.vx ** 2 + this.vy ** 2);
        if (speed < this.minVelocity) {
          this.stop();
          this.callback?.({ isActive: false, x: this.x, y: this.y, velocityX: 0, velocityY: 0 });
          return;
        }
        
        this.animId = requestAnimationFrame(this.animate);
      };
    }
    
    // ============================================
    // Demo Application
    // ============================================
    
    const wrapper = document.getElementById('canvas-wrapper');
    const draggable = document.getElementById('draggable');
    const logEl = document.getElementById('log');
    
    // UI Elements
    const pointerPosEl = document.getElementById('pointer-pos');
    const pointerDeltaEl = document.getElementById('pointer-delta');
    const isDraggingEl = document.getElementById('is-dragging');
    const hoveredSurfaceEl = document.getElementById('hovered-surface');
    const inertiaActiveEl = document.getElementById('inertia-active');
    const inertiaVelocityEl = document.getElementById('inertia-velocity');
    
    // Create surfaces array
    const surfaces = [
      { id: 'surface-1', element: document.getElementById('surface-1'), zIndex: 1 },
      { id: 'surface-2', element: document.getElementById('surface-2'), zIndex: 2 },
      { id: 'surface-3', element: document.getElementById('surface-3'), zIndex: 1 },
    ];
    
    // Initialize picking
    const picking = new SimplePicking();
    picking.setSurfaces(surfaces);
    picking.setCallbacks({
      onEnter: (surface) => {
        surface.element.classList.add('hovered');
        log('hover', `Enter: ${surface.id}`);
      },
      onLeave: (surface) => {
        surface.element.classList.remove('hovered');
        log('hover', `Leave: ${surface.id}`);
      },
    });
    
    // Initialize inertia
    const inertia = new SimpleInertia({
      friction: 0.95,
      bounce: 0.3,
    });
    
    // Set bounds based on wrapper size
    function updateBounds() {
      const box = draggable.getBoundingClientRect();
      inertia.setBounds({
        minX: 0,
        maxX: wrapper.clientWidth - box.width,
        minY: 0,
        maxY: wrapper.clientHeight - box.height,
      });
    }
    updateBounds();
    
    // Inertia callback
    inertia.setCallback((state) => {
      draggable.style.left = state.x + 'px';
      draggable.style.top = state.y + 'px';
      
      inertiaActiveEl.textContent = state.isActive ? 'Yes' : 'No';
      inertiaVelocityEl.textContent = state.isActive 
        ? `${(state.velocityX * 1000).toFixed(0)}, ${(state.velocityY * 1000).toFixed(0)} px/s`
        : '-';
      
      if (state.isActive) {
        log('inertia', `x: ${state.x.toFixed(0)}, y: ${state.y.toFixed(0)}`);
      }
    });
    
    // Dragging state
    let isDragging = false;
    let dragOffsetX = 0;
    let dragOffsetY = 0;
    let startX = 0;
    let startY = 0;
    
    // Pointer events
    wrapper.addEventListener('pointerdown', (e) => {
      const rect = wrapper.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      
      // Check if clicking on draggable
      const dRect = draggable.getBoundingClientRect();
      if (e.clientX >= dRect.left && e.clientX <= dRect.right &&
          e.clientY >= dRect.top && e.clientY <= dRect.bottom) {
        isDragging = true;
        dragOffsetX = e.clientX - dRect.left;
        dragOffsetY = e.clientY - dRect.top;
        startX = parseFloat(draggable.style.left) || 0;
        startY = parseFloat(draggable.style.top) || 0;
        
        draggable.classList.add('dragging');
        wrapper.setPointerCapture(e.pointerId);
        
        inertia.startTracking(startX, startY);
        
        isDraggingEl.textContent = 'Yes';
        log('drag', 'Drag started');
      } else {
        // Check picking
        const hits = picking.pick(x, y);
        if (hits.length > 0) {
          log('tap', `Tap on ${hits[0].surface.id}`);
        } else {
          log('tap', `Tap at (${x.toFixed(0)}, ${y.toFixed(0)})`);
        }
      }
    });
    
    wrapper.addEventListener('pointermove', (e) => {
      const rect = wrapper.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      
      pointerPosEl.textContent = `${x.toFixed(0)}, ${y.toFixed(0)}`;
      
      if (isDragging) {
        const newX = Math.max(0, Math.min(wrapper.clientWidth - draggable.offsetWidth, 
                                          e.clientX - rect.left - dragOffsetX));
        const newY = Math.max(0, Math.min(wrapper.clientHeight - draggable.offsetHeight,
                                          e.clientY - rect.top - dragOffsetY));
        
        const deltaX = newX - parseFloat(draggable.style.left || 0);
        const deltaY = newY - parseFloat(draggable.style.top || 0);
        
        draggable.style.left = newX + 'px';
        draggable.style.top = newY + 'px';
        
        inertia.addSample(newX, newY);
        
        pointerDeltaEl.textContent = `${deltaX.toFixed(1)}, ${deltaY.toFixed(1)}`;
      } else {
        // Update hover state
        const hits = picking.handleMove(x, y);
        hoveredSurfaceEl.textContent = hits.length > 0 
          ? hits.map(h => h.surface.id).join(', ')
          : 'None';
        pointerDeltaEl.textContent = '-';
      }
    });
    
    wrapper.addEventListener('pointerup', (e) => {
      if (isDragging) {
        isDragging = false;
        draggable.classList.remove('dragging');
        wrapper.releasePointerCapture(e.pointerId);
        
        inertia.release();
        
        isDraggingEl.textContent = 'No';
        log('drag', 'Drag ended');
      }
    });
    
    wrapper.addEventListener('pointercancel', (e) => {
      if (isDragging) {
        isDragging = false;
        draggable.classList.remove('dragging');
        inertia.stop();
        isDraggingEl.textContent = 'No';
      }
    });
    
    // Log function
    function log(type, message) {
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      entry.textContent = `[${type}] ${message}`;
      logEl.appendChild(entry);
      logEl.scrollTop = logEl.scrollHeight;
      
      // Limit log entries
      while (logEl.children.length > 50) {
        logEl.removeChild(logEl.firstChild);
      }
    }
    
    // Controls
    document.getElementById('btn-reset').addEventListener('click', () => {
      inertia.stop();
      draggable.style.left = '260px';
      draggable.style.top = '260px';
      log('tap', 'Position reset');
    });
    
    document.getElementById('btn-clear-log').addEventListener('click', () => {
      logEl.innerHTML = '';
    });
    
    // Initial log
    log('tap', 'Demo initialized. Drag the pink box or hover over surfaces.');
  </script>
</body>
</html>
