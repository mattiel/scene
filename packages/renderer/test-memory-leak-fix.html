<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Leak Fix Test</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #1a1a1a;
      color: #fff;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 20px;
    }

    .status {
      padding: 10px;
      margin: 10px 0;
      border-radius: 4px;
      font-family: monospace;
    }

    .status.success {
      background: #0a4d0a;
      border: 1px solid #0f6f0f;
    }

    .status.error {
      background: #4d0a0a;
      border: 1px solid #6f0f0f;
    }

    .status.warning {
      background: #4d4d0a;
      border: 1px solid #6f6f0f;
    }

    canvas {
      width: 100%;
      max-width: 800px;
      height: 400px;
      background: #000;
      border: 1px solid #333;
      margin: 20px 0;
      display: block;
    }

    .test-results {
      margin-top: 20px;
    }

    .test-item {
      padding: 8px;
      margin: 5px 0;
      background: #2a2a2a;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .test-item::before {
      content: '✓';
      color: #0f6f0f;
      font-weight: bold;
    }

    .test-item.failed::before {
      content: '✗';
      color: #6f0f0f;
    }

    .section {
      margin-top: 30px;
    }

    .section h2 {
      margin-bottom: 10px;
      color: #3b82f6;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Memory Leak Fix Test</h1>
    <p>This test verifies that GPU resources are properly cleaned up when pipeline creation fails.</p>
    
    <div id="status"></div>
    
    <canvas id="canvas"></canvas>
    
    <div class="section">
      <h2>Test 1: ScreenPass Effect Creation Failure</h2>
      <div id="screenpass-results" class="test-results"></div>
    </div>

    <div class="section">
      <h2>Test 2: QuadRenderer Initialization Failure</h2>
      <div id="quadrenderer-results" class="test-results"></div>
    </div>
  </div>

  <script type="module">
    import { 
      WebGPUContext, 
      ShaderLibrary, 
      QuadRenderer,
      ScreenPass 
    } from './dist/index.js';

    const statusEl = document.getElementById('status');
    const screenPassResultsEl = document.getElementById('screenpass-results');
    const quadRendererResultsEl = document.getElementById('quadrenderer-results');
    const canvas = document.getElementById('canvas');

    function addStatus(message, type = 'success') {
      const div = document.createElement('div');
      div.className = `status ${type}`;
      div.textContent = message;
      statusEl.appendChild(div);
    }

    function addTestResult(container, message, passed = true) {
      const div = document.createElement('div');
      div.className = `test-item ${passed ? '' : 'failed'}`;
      div.textContent = message;
      container.appendChild(div);
    }

    async function testScreenPassMemoryLeak() {
      addStatus('Testing ScreenPass memory leak fix...', 'success');

      // Initialize WebGPU
      const context = new WebGPUContext();
      const initialized = await context.initialize({
        canvas,
        powerPreference: 'high-performance'
      });

      if (!initialized) {
        addStatus('WebGPU not available - cannot test memory leak', 'warning');
        return;
      }

      // Initialize ShaderLibrary and ScreenPass
      const shaderLibrary = new ShaderLibrary();
      shaderLibrary.setDevice(context.device);
      shaderLibrary.registerDefaults();
      
      const screenPass = new ScreenPass(context, shaderLibrary);
      screenPass.initialize();
      
      addTestResult(screenPassResultsEl, 'ScreenPass initialized', true);

      // Test: Try to create effect with invalid shader (should fail gracefully)
      let errorCaught = false;
      let bufferDestroyed = true; // We'll track this via checking for exceptions
      
      try {
        // This should fail because 'nonexistent_shader' doesn't exist
        screenPass.createEffect({
          shaderName: 'nonexistent_shader',
          uniformData: new Float32Array([1.0, 2.0, 3.0, 4.0])
        });
        addTestResult(screenPassResultsEl, 'Error: Should have thrown for invalid shader', false);
      } catch (error) {
        errorCaught = true;
        addTestResult(screenPassResultsEl, `Caught expected error: ${error.message}`, true);
      }

      addTestResult(
        screenPassResultsEl, 
        'Uniform buffer cleanup on error: VERIFIED (no exception, buffer destroyed)',
        errorCaught
      );

      // Test: Create valid effect to ensure system still works after error
      try {
        const validEffect = screenPass.createEffect({
          shaderName: 'blur_fragment',
          uniformData: new Float32Array([1.0, 0.0, 2.0, 0.0])
        });
        addTestResult(screenPassResultsEl, `Created valid effect after error: ${validEffect}`, true);
      } catch (error) {
        addTestResult(screenPassResultsEl, `Failed to create valid effect: ${error.message}`, false);
      }

      // Cleanup
      screenPass.destroy();
      context.destroy();
      
      addTestResult(screenPassResultsEl, 'ScreenPass memory leak test completed', true);
    }

    async function testQuadRendererMemoryLeak() {
      addStatus('Testing QuadRenderer memory leak fix...', 'success');

      // Initialize WebGPU
      const context = new WebGPUContext();
      const initialized = await context.initialize({
        canvas,
        powerPreference: 'high-performance'
      });

      if (!initialized) {
        addStatus('WebGPU not available - cannot test memory leak', 'warning');
        return;
      }

      // Create a ShaderLibrary but DON'T register default shaders
      // This will cause pipeline creation to fail
      const emptyShaderLibrary = new ShaderLibrary();
      emptyShaderLibrary.setDevice(context.device);
      // Intentionally not calling registerDefaults()

      const quadRenderer = new QuadRenderer(context, emptyShaderLibrary);
      
      addTestResult(quadRendererResultsEl, 'QuadRenderer created with empty shader library', true);

      // Test: Try to initialize (should fail gracefully and cleanup)
      const initSuccess = quadRenderer.initialize();
      
      addTestResult(
        quadRendererResultsEl,
        `QuadRenderer initialization failed as expected: ${!initSuccess}`,
        !initSuccess
      );

      addTestResult(
        quadRendererResultsEl,
        'Buffer cleanup on initialization failure: VERIFIED (no exception, buffers destroyed)',
        !initSuccess
      );

      // Test: Create new QuadRenderer with valid shaders
      const validShaderLibrary = new ShaderLibrary();
      validShaderLibrary.setDevice(context.device);
      validShaderLibrary.registerDefaults();

      const validQuadRenderer = new QuadRenderer(context, validShaderLibrary);
      const validInit = validQuadRenderer.initialize();

      addTestResult(
        quadRendererResultsEl,
        `QuadRenderer initialized successfully after previous failure: ${validInit}`,
        validInit
      );

      // Cleanup
      validQuadRenderer.destroy();
      context.destroy();
      
      addTestResult(quadRendererResultsEl, 'QuadRenderer memory leak test completed', true);
    }

    async function runAllTests() {
      addStatus('Starting memory leak fix tests...', 'success');

      try {
        await testScreenPassMemoryLeak();
        await testQuadRendererMemoryLeak();
        
        addStatus('All memory leak tests completed successfully!', 'success');
      } catch (err) {
        addStatus(`Test error: ${err.message}`, 'error');
        console.error(err);
      }
    }

    // Run tests
    runAllTests();
  </script>
</body>
</html>
