<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Effect Name Collision Test</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #1a1a1a;
      color: #fff;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 20px;
    }

    .status {
      padding: 10px;
      margin: 10px 0;
      border-radius: 4px;
      font-family: monospace;
    }

    .status.success {
      background: #0a4d0a;
      border: 1px solid #0f6f0f;
    }

    .status.error {
      background: #4d0a0a;
      border: 1px solid #6f0f0f;
    }

    canvas {
      width: 100%;
      max-width: 800px;
      height: 400px;
      background: #000;
      border: 1px solid #333;
      margin: 20px 0;
      display: block;
    }

    .test-results {
      margin-top: 20px;
    }

    .test-item {
      padding: 8px;
      margin: 5px 0;
      background: #2a2a2a;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .test-item::before {
      content: '✓';
      color: #0f6f0f;
      font-weight: bold;
    }

    .test-item.failed::before {
      content: '✗';
      color: #6f0f0f;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Effect Name Collision Test</h1>
    <p>This test verifies that rapidly creating multiple effects doesn't cause name collisions.</p>
    
    <div id="status"></div>
    
    <canvas id="canvas"></canvas>
    
    <div class="test-results" id="results"></div>
  </div>

  <script type="module">
    import { 
      WebGPUContext, 
      ShaderLibrary, 
      ScreenPass 
    } from './dist/index.js';

    const statusEl = document.getElementById('status');
    const resultsEl = document.getElementById('results');
    const canvas = document.getElementById('canvas');

    function addStatus(message, type = 'success') {
      const div = document.createElement('div');
      div.className = `status ${type}`;
      div.textContent = message;
      statusEl.appendChild(div);
    }

    function addTestResult(message, passed = true) {
      const div = document.createElement('div');
      div.className = `test-item ${passed ? '' : 'failed'}`;
      div.textContent = message;
      resultsEl.appendChild(div);
    }

    async function runTest() {
      addStatus('Starting effect name collision test...', 'success');

      // Initialize WebGPU
      const context = new WebGPUContext();
      const initialized = await context.initialize({
        canvas,
        powerPreference: 'high-performance'
      });

      if (!initialized) {
        addStatus('WebGPU not available - test cannot run', 'error');
        return;
      }

      addStatus('WebGPU initialized successfully', 'success');

      // Initialize ShaderLibrary and ScreenPass
      const shaderLibrary = new ShaderLibrary();
      shaderLibrary.setDevice(context.device);
      shaderLibrary.registerDefaults();
      
      const screenPass = new ScreenPass(context, shaderLibrary);
      screenPass.initialize();
      
      addTestResult('ScreenPass initialized', true);

      // Test 1: Create multiple effects rapidly (should have caused collision with Date.now())
      const effectNames = [];
      const NUM_EFFECTS = 100;
      
      for (let i = 0; i < NUM_EFFECTS; i++) {
        const effectName = screenPass.createEffect({
          shaderName: 'blur_fragment',
          uniformData: new Float32Array([1.0, 0.0, 2.0, 0.0])
        });
        effectNames.push(effectName);
      }

      addTestResult(`Created ${NUM_EFFECTS} effects rapidly`, true);

      // Test 2: Verify all effect names are unique
      const uniqueNames = new Set(effectNames);
      const allUnique = uniqueNames.size === effectNames.length;
      
      addTestResult(
        `All effect names unique: ${uniqueNames.size} unique out of ${effectNames.length} total`,
        allUnique
      );

      if (!allUnique) {
        addStatus(`COLLISION DETECTED! ${effectNames.length - uniqueNames.size} duplicate names`, 'error');
        
        // Find duplicates
        const nameCount = new Map();
        effectNames.forEach(name => {
          nameCount.set(name, (nameCount.get(name) || 0) + 1);
        });
        
        nameCount.forEach((count, name) => {
          if (count > 1) {
            addTestResult(`Duplicate name "${name}" appeared ${count} times`, false);
          }
        });
      } else {
        addStatus('No collisions detected!', 'success');
      }

      // Test 3: Verify effect name format
      const firstEffect = effectNames[0];
      const lastEffect = effectNames[effectNames.length - 1];
      
      addTestResult(`First effect name: ${firstEffect}`, true);
      addTestResult(`Last effect name: ${lastEffect}`, true);

      const pattern = /^blur_fragment_\d+$/;
      const allMatchPattern = effectNames.every(name => pattern.test(name));
      
      addTestResult(
        `All effect names match expected pattern (shader_N): ${allMatchPattern}`,
        allMatchPattern
      );

      // Test 4: Verify counters are sequential
      const counters = effectNames.map(name => parseInt(name.split('_').pop()));
      const areSequential = counters.every((counter, idx) => counter === idx + 1);
      
      addTestResult(
        `Effect counters are sequential (1-${NUM_EFFECTS}): ${areSequential}`,
        areSequential
      );

      addTestResult(`Counter range: ${Math.min(...counters)} to ${Math.max(...counters)}`, true);

      // Cleanup
      addStatus('Test completed successfully!', 'success');
      screenPass.destroy();
      context.destroy();
    }

    // Run test
    runTest().catch(err => {
      addStatus(`Test error: ${err.message}`, 'error');
      console.error(err);
    });
  </script>
</body>
</html>
